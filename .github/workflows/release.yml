name: Release

on:
  push:
    branches:
      - release/**

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend pre-prod deploy
        run: |
          curl -X POST "${{ secrets.RENDER_PREPROD_BACKEND_HOOK }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger frontend pre-prod deploy
        run: |
          curl -X POST "${{ secrets.RENDER_PREPROD_FRONTEND_HOOK }}"